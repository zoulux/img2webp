name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    strategy:
      matrix:
        arch: [arm64, amd64]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Build
        env:
          CGO_ENABLED: 1
          GOARCH: ${{ matrix.arch }}
        run: |
          go build -ldflags="-s -w" -o img2webp-darwin-${{ matrix.arch }} .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: img2webp-darwin-${{ matrix.arch }}
          path: img2webp-darwin-${{ matrix.arch }}
          if-no-files-found: error

  build-linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - arch: amd64
            cc: gcc
          - arch: arm64
            cc: aarch64-linux-gnu-gcc
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Install OpenCL headers and libs (amd64)
        if: matrix.arch == 'amd64'
        run: sudo apt-get install -y ocl-icd-opencl-dev

      - name: Install cross-compiler and OpenCL (arm64)
        if: matrix.arch == 'arm64'
        run: |
          sudo apt-get install -y gcc-aarch64-linux-gnu
          sudo apt-get install -y ocl-icd-opencl-dev
          sudo mkdir -p /usr/lib/aarch64-linux-gnu
          sudo ln -sf /usr/lib/x86_64-linux-gnu/libOpenCL.so /usr/lib/aarch64-linux-gnu/libOpenCL.so

      - name: Build
        env:
          CGO_ENABLED: 1
          GOARCH: ${{ matrix.arch }}
          CC: ${{ matrix.cc }}
        run: |
          go build -ldflags="-s -w" -o img2webp-linux-${{ matrix.arch }} .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: img2webp-linux-${{ matrix.arch }}
          path: img2webp-linux-${{ matrix.arch }}
          if-no-files-found: error

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Install MinGW-w64
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-gcc

      - name: Download OpenCL headers
        shell: pwsh
        run: |
          $headers = @("cl.h", "cl_platform.h", "cl_gl.h", "cl_gl_ext.h", "cl_ext.h", "cl_version.h")
          $url = "https://raw.githubusercontent.com/KhronosGroup/OpenCL-Headers/main/CL"
          New-Item -ItemType Directory -Force -Path "C:\opencl\include\CL"
          foreach ($h in $headers) {
            Invoke-WebRequest -Uri "$url/$h" -OutFile "C:\opencl\include\CL\$h"
          }

      - name: Build
        shell: pwsh
        env:
          CGO_ENABLED: 1
          CC: C:\msys64\mingw64\bin\gcc.exe
          CGO_CFLAGS: -IC:/opencl/include
        run: go build -ldflags="-s -w" -o img2webp-windows-amd64.exe .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: img2webp-windows-amd64.exe
          path: img2webp-windows-amd64.exe
          if-no-files-found: error

  release:
    needs: [build-macos, build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List files
        run: ls -la artifacts/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
