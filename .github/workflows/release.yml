name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    strategy:
      matrix:
        arch: [arm64, amd64]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Build
        env:
          CGO_ENABLED: 1
          GOARCH: ${{ matrix.arch }}
        run: |
          go build -ldflags="-s -w" -o img2webp-darwin-${{ matrix.arch }} .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: img2webp-darwin-${{ matrix.arch }}
          path: img2webp-darwin-${{ matrix.arch }}
          if-no-files-found: error

  build-linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - arch: amd64
            cc: gcc
          - arch: arm64
            cc: aarch64-linux-gnu-gcc
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Install OpenCL (amd64)
        if: matrix.arch == 'amd64'
        run: sudo apt-get install -y ocl-icd-opencl-dev

      - name: Install cross-compiler and OpenCL (arm64)
        if: matrix.arch == 'arm64'
        run: |
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
          # Download and build OCL-ICD for arm64
          git clone https://github.com/OCL-dev/ocl-icd.git
          cd ocl-icd
          ./configure --host=aarch64-linux-gnu --prefix=/usr/aarch64-linux-gnu
          make -j$(nproc)
          sudo make install
          cd ..

      - name: Build
        env:
          CGO_ENABLED: 1
          GOARCH: ${{ matrix.arch }}
          CC: ${{ matrix.cc }}
        run: |
          go build -ldflags="-s -w" -o img2webp-linux-${{ matrix.arch }} .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: img2webp-linux-${{ matrix.arch }}
          path: img2webp-linux-${{ matrix.arch }}
          if-no-files-found: error

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Install MinGW-w64
        run: choco install mingw -y

      - name: Download OpenCL SDK
        shell: pwsh
        run: |
          # Download OpenCL headers
          $headers = @("cl.h", "cl_platform.h", "cl_gl.h", "cl_gl_ext.h", "cl_ext.h", "cl_version.h", "cl_icd.h")
          $url = "https://raw.githubusercontent.com/KhronosGroup/OpenCL-Headers/main/CL"
          New-Item -ItemType Directory -Force -Path "C:\opencl\include\CL"
          foreach ($h in $headers) {
            Invoke-WebRequest -Uri "$url/$h" -OutFile "C:\opencl\include\CL\$h"
          }
          # Create OpenCL.def for import library
          @"
          LIBRARY OpenCL
          EXPORTS
            clGetPlatformIDs
            clGetPlatformInfo
            clGetDeviceIDs
            clGetDeviceInfo
            clCreateContext
            clReleaseContext
            clCreateCommandQueue
            clReleaseCommandQueue
            clCreateBuffer
            clReleaseMemObject
            clCreateProgramWithSource
            clReleaseProgram
            clBuildProgram
            clCreateKernel
            clReleaseKernel
            clSetKernelArg
            clEnqueueWriteBuffer
            clEnqueueReadBuffer
            clEnqueueNDRangeKernel
            clFinish
          "@ | Out-File -FilePath "C:\opencl\lib\OpenCL.def" -Encoding ascii
          # Generate import library
          C:\mingw64\bin\dlltool.exe -d C:\opencl\lib\OpenCL.def -l C:\opencl\lib\libOpenCL.a

      - name: Build
        shell: pwsh
        env:
          CGO_ENABLED: 1
          CGO_CFLAGS: -IC:/opencl/include
          CGO_LDFLAGS: -LC:/opencl/lib -lOpenCL
        run: go build -ldflags="-s -w" -o img2webp-windows-amd64.exe .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: img2webp-windows-amd64.exe
          path: img2webp-windows-amd64.exe
          if-no-files-found: error

  release:
    needs: [build-macos, build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List files
        run: ls -la artifacts/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
